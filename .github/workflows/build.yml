name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            platform: win
          - name: Android32
            platform: android32
          - name: Android64
            platform: android64
          - name: macOS
            platform: mac
          - name: iOS
            platform: ios

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.platform == 'win' && 'windows-latest' || matrix.config.platform == 'ios' && 'macos-latest' || matrix.config.platform == 'mac' && 'macos-latest' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.platform }}

  package:
    runs-on: ubuntu-latest
    needs: build
    name: Package
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: geode-package
          path: ${{ steps.build.outputs.build-output }}
