name: Build Geode Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true

      - uses: actions/upload-artifact@v4
        with:
          name: CFS-Perfect-FPS
          path: "**/*.geode"
          if-no-files-found: error