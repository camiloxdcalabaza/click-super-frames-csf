name: Build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19 libc++-19-dev
          clang-19 --version
          clang++-19 --version

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          cli: nightly
          target: Win64
